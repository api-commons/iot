context: iot
name: IoT Devices
intro: >-
  The common IoT vocabulary -- the devices in the field, the sensors on them, the telemetry
  they report, the commands sent back to them and the firmware updates that keep them current
  -- distilled from the APIs that already exist. Vehicles belong to the fleet context.
tags: [IoT, Internet of Things, Industrial IoT, IIoT, Sensors, Smart Home, Device Management, Connected Devices]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url]

common_fields:
  id: [uuid, guid, object_id, record_id, device_id, serial, uid, thing_name]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, provisioned_at, registered_at]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties, tags, labels]
  status: [state, connection_status, online, is_online, connected, connectivity_status, health]
  name: [title, display_name, label, device_name, nickname]
  device_id: [device, device_uid, thing_id, thing, asset_id, endpoint_id, serial_number]
  timestamp: [time, ts, recorded_at, measured_at, received_at, event_time, datetime, captured_at]

concepts:
  device:
    segments: [devices, device, things, thing, gateways, endpoints@iot|devices, nodes@iot|mesh]
    aliases:
      type: [device_type, model, product, product_id, kind, category, hardware]
      serial_number: [serial, sn, hardware_id, imei, mac, mac_address, eui, dev_eui]
      firmware_version: [firmware, fw_version, software_version, version, os_version]
      last_seen_at: [last_seen, last_contact, last_connected_at, last_heartbeat, last_activity, last_reported_at]
      location: [position, coordinates, site_id, location_id, geo]
      group_id: [group, fleet_id, fleet, project_id, product_uid]
  # sensor was measured and dropped: 1 provider; sensors are a device's channels or a field in
  # its telemetry.
  telemetry:
    requires: [device]
    segments: [telemetry, readings, reading, measurements, measurement, "data@devices|device|sensors|things", events@devices|device, samples, observations@sensors|datastreams, timeseries@devices]
    aliases:
      value: [values, reading, measurement, result, payload, data_value]
      unit: [units, uom]
      sensor_id: [sensor, channel_id, datastream_id, metric, field]
  device_command:
    requires: [device]
    path: /devices/{device_id}/commands
    segments: ["commands@devices|device|things", "actions@devices|device", "methods@devices", rpc@devices, jobs@devices|things]
    aliases:
      command: [name, method, action, type, function]
      parameters: [params, arguments, payload, args, body]
      executed_at: [completed_at, sent_at, delivered_at]
  firmware_update:
    requires: [device]
    path: /firmware-updates
    segments: [firmware, firmwares, firmware_updates, firmware-updates, ota, ota_updates, updates@firmware|devices, deployments@firmware|ota, releases@firmware]
    aliases:
      version: [firmware_version, release, build, version_name]
      url: [download_url, file_url, image_url, binary_url]
      target_devices: [device_ids, devices, targets, groups]

duplicates:
  amazon-iot-core: [amazon-iot-device-defender, amazon-iot-device-management]

findings:
  - "A device agrees on name, id and type across IoT clouds, smart-home platforms and
    industrial systems; firmware version and last-seen time are carried by too few to share."
  - "Telemetry agrees only on a timestamp -- a reading is a value, a map of values, a
    fragment or a sample with every sensor in it, depending on the platform."
  - "A device command agrees on the command and its status -- the remote-procedure-call shape
    that IoT platforms share."
decisions:
  - "Things, gateways and endpoints beneath a device path are devices; vehicles are fleet's."
  - "Readings, measurements, samples and device events are telemetry."
  - "Device jobs (AWS IoT) and RPC calls are device commands; OTA jobs and firmware deployments
    are firmware updates (`/firmware-updates`)."
  - "Sensors were measured and dropped (1 provider)."
  - "Duplicates merged: three AWS IoT listings into AWS IoT Core."
