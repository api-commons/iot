      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createFirmwareUpdate
      summary: Create a firmware update
      tags:
      - Firmware Updates
      x-commons-tier: core
      x-commons-share: 0.545
      responses:
        '200':
          description: OK
