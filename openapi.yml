      requestBody:
        required: true
        content:
          application/json:
            schema: *id003
    get:
      operationId: listDeviceCommands
      summary: List commands
      tags:
      - Device Commands
      x-commons-tier: extended
      x-commons-share: 0.417
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: *id003
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
  /devices/{device_id}/commands/{device_command_id}:
    parameters:
    - $ref: '#/components/parameters/device_id'
    - $ref: '#/components/parameters/device_command_id'
    get:
      operationId: getDeviceCommand
      summary: Get a device command
      tags:
      - Device Commands
      x-commons-tier: extended
