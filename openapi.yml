openapi: 3.1.0
info:
  title: IoT Devices (API Commons)
  version: 0.1.0-draft.20261111
  description: 'The common IoT Devices interface, distilled from the harvested OpenAPI of 195 providers in the APIs.io
    catalog. Not a product: no one serves this API. It is the shape the market already shares, measured, so that
    providers, agents and integrators can map to one vocabulary. See profile.yml.'
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
paths:
  /devices:
    get:
      operationId: listDevices
      summary: List devices
      tags:
      - Devices
      x-commons-tier: core
      x-commons-share: 0.928
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: &id001
                  $ref: '#/components/schemas/Device'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createDevice
      summary: Create a device
      tags:
      - Devices
      x-commons-tier: extended
      x-commons-share: 0.464
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
  /devices/{device_id}:
    parameters:
    - $ref: '#/components/parameters/device_id'
    get:
      operationId: getDevice
      summary: Get a device
      tags:
      - Devices
      x-commons-tier: core
      x-commons-share: 0.754
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
    delete:
      operationId: deleteDevice
      summary: Delete a device
      tags:
      - Devices
      x-commons-tier: extended
      x-commons-share: 0.464
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
    patch:
      operationId: updateDevice
      summary: Update a device
      tags:
      - Devices
      x-commons-tier: extended
      x-commons-share: 0.406
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
  /telemetries:
    get:
      operationId: listTelemetries
      summary: List telemetries
      tags:
      - Telemetries
      x-commons-tier: core
      x-commons-share: 0.833
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: &id002
                  $ref: '#/components/schemas/Telemetry'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createTelemetry
      summary: Create a telemetry
      tags:
      - Telemetries
      x-commons-tier: extended
      x-commons-share: 0.278
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema: *id002
  /telemetries/{telemetry_id}:
    parameters:
    - $ref: '#/components/parameters/telemetry_id'
    get:
      operationId: getTelemetry
      summary: Get a telemetry
      tags:
      - Telemetries
      x-commons-tier: extended
      x-commons-share: 0.222
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
  /devices/{device_id}/commands:
    parameters:
    - $ref: '#/components/parameters/device_id'
    post:
      operationId: createDeviceCommand
      summary: Create a device command
      tags:
      - Device Commands
      x-commons-tier: core
      x-commons-share: 0.667
